# [nuc_unist — 개발용 기체 @ UNIST] 라이다 전방 25° 하향 장착, 기체(body) 기준 ±15° FOV 모사.
#   실행:  roslaunch epic_planner real_flight.launch config_file:=nuc_unist.yaml
#   (전용 launch 파일을 새로 만들지 말 것 — real_flight.launch 의 config_file 인자로 충분하다.)
#   crop on/off 는 launch 인자가 아니라 아래 cloud_crop/enable 이다. real_flight.launch:35 의
#   cloud_crop_bridge 노드는 무조건 뜨고, enable: false 면 브릿지가 자진 종료한다.
#   (ws/epic/README.md 가 아직 use_cloud_crop_bridge 인자를 설명하는데, 그 인자는 없다.)
#
# 베이스: mid360_mlx.yaml (장착각 25° 동일). 차이는 크롭 원뿔이 body ±17.5° → ±15° 인 것뿐이다.
#
# ── 이 프로파일의 3가지 선택 ────────────────────────────────────────────
#  1) 장착각 25° 하향  — mid360_mlx.yaml 과 동일 기체이므로 그 값을 그대로 따른다.
#     lidar_perception/fov_up·down(40.0/10.0) = 목표 body ±15 + lidar_pitch 25 로 묶여 있다.
#     실측이 25° 가 아니면 이 둘을 함께 고칠 것 — 브릿지가 기동 시 자체검사한다(strict_fov_alignment).
#  2) odom 은 PX4 EKF2 출력(/mavros/local_position/odom) — 이미 기체 수평 자세라
#     cloud_crop/odom_mount_pitch_deg 는 0.0, sync_policy 는 approximate 다. (아래 각 항목 주석 참고)
#  3) 속도/yaw 는 real1.yaml 과 동기화: MaxVelMag 0.75, yaw_max_vel 1.5, max_traj_len 5.0.
#
# ── ★ FOV 표기 프레임: 같은 원뿔인데 파라미터마다 기준이 다르다 ────────────
# 이 파일에서 "위아래 15도"는 세 곳에 서로 다른 숫자로 적혀 있다. 전부 같은
# 기체(body) 기준 ±15° 원뿔을 말한다. 값이 달라 보이는 건 표기 프레임이 달라서다.
#
#   파라미터                              프레임   여기 적힌 값   누가 환산하나
#   ----------------------------------- -------- ------------- -----------------------------
#   cloud_crop/fov_up / fov_down          body      15 / -15     환산 없음 (브릿지가 body 로 크롭)
#   lidar_perception/fov_up / fov_down    센서      40 /  10     planner_manager.cpp:1022,1025
#                                                                 이 (fov − lidar_pitch) 로 환산
#   lidar_perception/fov_viewpoint_up/down 센서     40 /  10     frontier_manager.cpp:1495,1508
#                                                                 이 Ry(−lidar_pitch) 로 환산
#
#   센서 프레임 값 = 목표 body 값 + lidar_pitch(25).  40 = 15+25,  10 = -15+25.
#
# ▸ 어디를 만져야 하나
#   · 목표 원뿔을 바꾸고 싶다 (예: body ±15 -> ±20)
#       -> cloud_crop/fov_up·down 을 ±20 으로, lidar_perception/fov_up·down 과
#          fov_viewpoint_up·down 을 45/5 (=±20+25) 로. 즉 세 쌍을 함께.
#   · 장착각이 25° 가 아닌 것으로 실측됐다 (예: 20°)
#       -> lidar_pitch 20, lidar_perception/fov_up·down 35/5, fov_viewpoint 35/5.
#          cloud_crop/fov_up·down 은 body 기준이라 ±15 그대로 둔다.
#   · odom 토픽을 바꿨다
#       -> cloud_crop/odom_mount_pitch_deg 만 바꾼다 (mavros=0.0, FAST-LIO /Odometry=25.0).
#          FOV 값은 셋 다 그대로.
#
# ▸ 틀리면 어떻게 되나 — 브릿지가 기동 시 아래를 검사하고 FATAL 로 죽는다
#   (cloud_crop/strict_fov_alignment: true). 조용히 틀린 채 날지는 않는다.
#       cloud_crop/fov_up   == lidar_perception/fov_up   − lidar_perception/lidar_pitch
#       cloud_crop/fov_down == lidar_perception/fov_down − lidar_perception/lidar_pitch
#       cloud_crop/fov_horizontal == lidar_perception/yaw_fov
#   정적 확인:
#     python3 debug/mid360_fov_alignment/src/verify_fov_alignment.py <이 파일> --strict
#
# ▸ 주의: lidar_perception/fov_up·down 은 corridor cone clip 에서만 쓰이며,
#   그 경로는 아래 local_planning/clip_corridor_to_observed + clip_cone_faces 가
#   둘 다 true 일 때만 동작한다 (이 파일은 둘 다 true). 끄면 이 값들은 위 자체검사
#   외에는 아무 효력이 없다. (lidar_map_interface.cpp:125-126 도 같은 값을 읽지만
#   그 멤버 lp_->fov_up/fov_down 을 쓰는 코드는 없다 — dead path.)
#   반면 lidar_pitch 는 viewpoint 판정·corridor cone·lidar_q_ 에서 항상 쓰인다.
# ────────────────────────────────────────────────────────────────────
#
# ── 실기 투입 전 확인 (TODO) ──────────────────────────────────────────
#  · cloud_topic(/cloud_registered)이 이 기체의 실제 SLAM 출력과 맞는지.
#    이 파일은 FAST-LIO 기준이다. LIO-SAM 기체라면 real1/real2 처럼
#    /lio_sam/mapping/cloud_registered_raw 로 바꿀 것.
#  · frame_id 경고: cloud(camera_init)와 odom(odom/map)의 frame_id 가 달라 기동 시 WARN 이 한 번 뜬다.
#    static TF(map->odom->camera_init identity)로 정합시킨 구성이라 정상이며, 그래서
#    require_frame_match 는 false 로 둔다. TF 가 실제로 identity 인지는 비행 전 확인할 것.
# ────────────────────────────────────────────────────────────────────
#topic param:
# 실비행용. FAST-LIO 출력에 맞춰 시뮬 토픽에서 변경.

# [EPIC 위치 입력][ROS 토픽][비행필수]
# MID360으로 ML-X FOV를 모사할 때 EPIC이 사용할 기체 위치·자세·속도 입력.
# 적용 기준: PX4 EKF2 융합 출력(/mavros/local_position/odom)을 사용한다. 이 기체가 원래 쓰던 소스다.
#   이 토픽의 자세는 이미 '기체(body) 수평 자세'다 — 4_tf_odom_relay.sh 의 odom_mount_comp_relay.py 가
#   /Odometry(센서 자세)에 Ry(-25°)를 적용해 PX4 EV 로 넣기 때문이다.
#   따라서 브릿지에서 추가 장착각 보정이 필요 없다 → cloud_crop/odom_mount_pitch_deg: 0.0 (아래 참고).
# 연쇄 주의: 이 토픽을 FAST-LIO /Odometry 로 되돌린다면 아래 세 가지를 함께 바꿔야 한다.
#   odom_mount_pitch_deg: 0.0 -> 25.0  /  sync_policy: approximate -> exact
#   (cloud_crop/fov_up·fov_down 은 body 기준이라 어느 쪽이든 ±15 그대로다.)
# 트레이드오프(알고 쓸 것): mavros 경로는 MAVLink 전송 + EKF2 필터링만큼 자세가 늦고,
#   EV 링크가 열화되면 EKF2 원점이 camera_init 에서 조용히 벗어나 크롭 원뿔이 어긋날 수 있다.
#   그 경우 crop 결과가 틀려도 경고가 없으므로, 비행 로그에서 crop 유지율(%)을 확인할 것.
# 대안: real1/real2 는 /mavros/odometry/in 을 쓴다. 이 기체는 /mavros/local_position/odom 계보다.
# 확인: rostopic info /mavros/local_position/odom
odometry_topic: /mavros/local_position/odom   # PX4 EKF2 odom (기체 수평 자세 — odom_mount_pitch_deg 0.0 과 짝)
# 이 프로파일에서는 /cloud_registered가 bridge의 원본 입력이며, ML-X FOV로 한 번 crop한 /cloud_registered_cropped를 EPIC이 사용한다.
cloud_topic: /cloud_registered    # FAST-LIO world-frame cloud (시뮬: /quad0_pcl_render_node/cloud)

# [LiDAR FOV·장착각·좌표계][수정 금지]
# 모든 lidar_perception/* 값은 LiDAR 사양·물리 장착각·odom/point cloud 좌표계에 맞춰 검증된 고정값이므로 절대로 개별 수정하지 않는다.
lidar_perception/cloud_frame_mode: world

# ── ML-X FOV 에뮬레이션: 센서 crop 브릿지 (cloud_crop_bridge) ──────────────
# Mid-360(수평 360°) 데이터를 ML-X(전방 120°x35°)처럼 잘라 EPIC 에 공급하는 스위치.
# FAST-LIO 는 raw 센서를 그대로 쓰므로 localization 영향 없음 — EPIC 입력만 잘린다.
# true  = 브릿지가 위 cloud_topic 을 스캔 시점 기체 자세 기준 FOV/거리로 crop 해
#         cloud_crop/output_topic 으로 재발행하고, exploration_node 도 같은 키를
#         읽어 자동으로 crop 토픽을 구독 (cloud_topic 은 raw 소스로 그대로 둔다).
# false = 브릿지 자진 종료, EPIC 은 cloud_topic 을 그대로 구독 (기존 동작).
#
# [파라미터 규약] cloud_crop/fov_* 는 전부 기체(body) 프레임 기준이다. 물리 장착각은
# odom_mount_pitch_deg 하나로만 반영하고 브릿지가 회전행렬에 흡수한다 — yaw/fov 값에
# 수동 보정값을 섞어 넣지 않는다. 아래 값은 브릿지 기동 시 자체검사되며(strict_fov_alignment),
# 불일치하면 기동을 거부한다:
#   cloud_crop/fov_up        == lidar_perception/fov_up   − lidar_perception/lidar_pitch
#   cloud_crop/fov_down      == lidar_perception/fov_down − lidar_perception/lidar_pitch
#   cloud_crop/fov_horizontal == lidar_perception/yaw_fov
cloud_crop/enable: true
cloud_crop/output_topic: /cloud_registered_cropped
# ★ 이 프로파일의 목표: 기체(body) 기준 위아래 ±15° 원뿔을 모사한다.
# 라이다는 전방 25° 아래로 엎어 장착돼 있고(lidar_pitch: 25.0), 그 장착각은
# cloud_crop/odom_mount_pitch_deg 하나로만 반영된다 — 아래 fov 값에 25를 섞어 넣지 않는다.
# 연동값 (셋이 한 세트로 움직인다. 장착각이 25가 아닌 것으로 실측되면 셋 다 바꿔야 한다):
#   cloud_crop/fov_up/down            = ±15          (body, 이 파일의 목표치)
#   lidar_perception/fov_up/down      = ±15 + 25     = 40.0 / 10.0  (센서 프레임)
#   cloud_crop/odom_mount_pitch_deg   = lidar_perception/lidar_pitch = 25.0
# 이 설정에서 crop 원뿔 / corridor cone / viewpoint 모델이 전부 body ±15°로 일치한다
# (fov_viewpoint_up/down 40.0/10.0 − lidar_pitch 25 = ±15).
cloud_crop/fov_horizontal: 120.0        # body 수평 전체각 [deg], 기체 +x(전방) 중심
cloud_crop/fov_up: 15.0                 # body elevation 상한 [deg]
cloud_crop/fov_down: -15.0              # body elevation 하한 [deg]
cloud_crop/yaw_offset_deg: 0.0          # body +x 기준 수평 오프셋 [deg, CCW]
cloud_crop/min_range: 0.0               # [m]
cloud_crop/max_range: 30.0              # [m], <= 0 = 무제한
# odom 자세를 body 로 되돌릴 하향 보정각. odometry_topic 이 무엇이냐에만 달려 있고,
# 물리 장착각(lidar_perception/lidar_pitch: 25.0)과는 별개다:
#   /mavros/local_position/odom (현재) -> 이미 기체 수평 자세 -> 0.0
#   /Odometry (FAST-LIO)               -> 센서 자세          -> 25.0 (= lidar_pitch)
cloud_crop/odom_mount_pitch_deg: 0.0
# mavros odom 은 FAST-LIO cloud 와 스탬프가 일치하지 않는다. exact 로 두면 ExactTime 이
# 영영 매칭되지 않아 브릿지가 아무것도 발행하지 않는다(워치독이 잡아주지만 애초에 만들지 말 것).
cloud_crop/sync_policy: approximate
cloud_crop/sync_queue: 20
cloud_crop/sync_max_interval_sec: 0.10  # approximate 전용 (exact 에서는 미사용)
cloud_crop/cloud_queue: 5
cloud_crop/odom_queue: 20
cloud_crop/pub_queue: 2
cloud_crop/watchdog_period_sec: 0.5     # 0=비활성
cloud_crop/require_frame_match: false   # true면 frame_id 불일치 시 FATAL
cloud_crop/strict_fov_alignment: true   # 위 정합식 불일치 시 FATAL
cloud_crop/output_fields: full          # full | xyz
cloud_crop/profile_log: true            # 구간 계측 로그
cloud_crop/visualization_topic: /debug/cloud_crop/fov
cloud_crop/visualization_rate_hz: 1.0   # 0=비활성
cloud_crop/visualization_range: 30.0    # max_range와 동일
cloud_crop/visualization_azimuth_samples: 24
cloud_crop/visualization_elevation_samples: 8
# ====================================================================
# global_planning/* : 전역 탐사 목표 선택 시작

global_planning/w_vdir: 0.0
global_planning/w_yawdir: 0.0
global_planning/w_firstnode: 0.2

# global_planning/* : 전역 탐사 목표 선택 끝
# ====================================================================

# [RViz 디버그 시각화]
view_graph: true                    # topology graph의 노드와 edge 표시
FrontierManager/view_cluster: true # frontier cluster와 선택 viewpoint 표시
FrontierManager/view_frt: true     # DENSE·SPARSE·frontier cell 점군 표시

# ====================================================================
# bubble_topo/*, bubble_astar/* : Topology graph 생성·경로 탐색 시작

# [Topology 후보 공간 분할]
# 빈 공간을 얼마나 잘게 나누어 RViz에서 초록색으로 표시되는 topology graph의 경로 연결점 후보를 찾을지 결정한다.
# 값 증가 시 연산량은 감소하지만 좁은 공간의 연결점을 놓칠 수 있고, 값 감소 시 좁은 공간을 더 세밀하게 검사하지만 처리 속도가 느려질 수 있다.
# 초록색 graph의 촘촘함에 간접적으로 영향을 주지만 node 간격이나 그물 크기를 직접 지정하는 값은 아니다.
bubble_topo/min_x: 1.11  # X축 박스의 최소 분할 크기[m]
bubble_topo/min_y: 1.11  # Y축 박스의 최소 분할 크기[m]
bubble_topo/min_z: 0.51  # Z축 박스의 최소 분할 크기[m]

# [Topology 맵 갱신 구역 크기]
# 전체 탐사 맵을 topology 계산용 박스들로 나눌 때 각 박스의 X·Y·Z 크기를 몇 m로 설정할지 결정한다.
# 값 증가 시 구역 수는 감소하지만 구역당 연산량이 증가하며, 값 감소 시 세밀한 갱신이 가능하지만 구역 수와 갱신 호출이 증가한다.
# 경로 연결점의 간격이나 크기를 직접 결정하는 값은 아니다.
bubble_topo/init_region_size_x: 1.5  # 계산용 박스의 가로 길이(X축)[m]
bubble_topo/init_region_size_y: 1.5  # 계산용 박스의 세로 길이(Y축)[m]
bubble_topo/init_region_size_z: 1.0  # 계산용 박스의 높이(Z축)[m]

# [Topology 박스 내부 검사점 간격]
# topology 계산용 박스 안을 바둑판처럼 나누어 경로 연결점을 만들 수 있는 빈 공간을 얼마나 촘촘하게 확인할지 결정한다.
# 값 증가 시 연산량은 감소하지만 좁은 통로의 연결점을 놓칠 수 있고, 값 감소 시 좁은 통로를 더 세밀하게 확인하지만 연산량과 메모리 사용량이 증가한다.
# LiDAR point cloud의 voxel 크기나 map downsampling 해상도가 아니며 topology graph의 node 간격을 직접 지정하지도 않는다.
bubble_topo/cube_discrete_size: 0.4  # 박스 내부 가상 검사점 사이의 거리[m]

# [드론 이동 이력 연결점 간격]
# 드론이 지나온 길을 다시 사용할 수 있도록 RViz의 초록색 topology graph에 이동 이력 연결점을 최소 몇 m 간격으로 남길지 결정한다.
# 값 증가 시 연산량은 감소하지만 코너나 좁은 통로의 연결이 끊길 수 있고, 값 감소 시 복귀 경로 연결성은 좋아지지만 node·edge 수와 연산량이 증가한다.
# 모든 topology node의 간격이나 edge 길이가 아니라 드론이 실제로 지나온 경로에 추가하는 이력 node의 최소 간격이다.
bubble_topo/odom_node_distance: 1.5  # 이동 경로에 추가하는 이력 연결점의 최소 거리[m]

# [Topology 노드·경로 공통 장애물 안전거리]
# topology 노드 생성·유지, 이동 이력 노드, 엣지 A*, 이전 목표 재사용 및 일반 Local Bubble A* 노드 판정이 모두 이 값을 사용한다.
# 값 증가 시 안전 여유는 커지지만 좁은 통로의 경로를 찾지 못할 수 있고, 값 감소 시 좁은 통로를 통과할 가능성은 커지지만 충돌 위험이 증가한다.
# 이전 구현은 별도 bubble_min_radius, 하드코딩 +0.1 m 및 goal 반경의 추가 0.01 m 판정 때문에 노드·엣지 판정이 달라져 연결과 설정 해석을 방해했다.
# 현재는 이 값 하나로 통일했으며 최종 MINCO 궤적 안전거리는 DilateRadiusHard/Soft 및 실제 기체 크기와 별도로 확인한다.
bubble_astar/safe_distance: 0.2  # topology 노드와 경로가 장애물에서 확보할 공통 최소 거리[m]

# [기존 Topology 노드 위치 매칭 허용거리]
# 갱신 전후 node 중심이 이 거리 이내이고 기존 node가 safe_distance를 만족하면 같은 연결점으로 유지한다.
# 값 증가 시 node·edge의 생성과 삭제 반복은 줄지만 가까운 별도 연결점을 같은 node로 볼 수 있고, 값 감소 시 위치 구분은 정밀하지만 작은 점군 변화에도 graph가 흔들릴 수 있다.
# 기존 node가 safe_distance를 만족하지 않으면 위치 차이와 관계없이 매칭하지 않고 제거하므로 장애물 안전거리를 완화하는 값이 아니다.
bubble_topo/node_match_tolerance: 0.10  # 갱신 전후 같은 node로 인정할 최대 중심 위치 차이[m]

# [신규 Topology 노드 생성 안정화 여유거리]
# 새 경로 연결점은 공통 안전거리보다 이 값만큼 더 멀리 있을 때만 topology graph에 처음 추가한다.
# 값 증가 시 안전거리 경계의 node 생성·삭제 반복은 줄지만 좁은 통로의 신규 연결점이 감소할 수 있고, 값 감소 시 신규 연결점은 늘지만 경계에서 graph가 흔들릴 수 있다.
# 기존 node의 유지·삭제와 edge 안전 판정은 계속 safe_distance를 사용하므로 장애물 안전거리를 완화하는 값이 아니다.
bubble_topo/node_insert_margin: 0.05  # 신규 node 삽입 기준 = safe_distance + 0.05 m

# [신규 Topology 노드 위치 흔들림 방지]
# 신규 생성 기준을 통과한 bubble 중 최대 장애물 여유거리와 이 값 이내인 후보를 동급으로 보고, topology 박스 중심에 가장 가까운 위치를 선택한다.
# 값 증가 시 작은 점군 변화에도 node 위치가 안정적으로 유지되지만 가장 넓은 위치에서 멀어질 수 있고, 값 감소 시 더 넓은 위치를 우선하지만 후보 간 node 위치가 바뀔 수 있다.
# 이 값은 신규 node의 안전거리 기준을 낮추지 않으며, 반드시 safe_distance + node_insert_margin을 통과한 후보에만 적용한다.
bubble_topo/node_clearance_tie_tolerance: 0.10  # 동급으로 볼 장애물 여유거리 차이[m]

# [한 번에 갱신할 Topology 박스 수]
# LiDAR로 새로운 공간을 관측했을 때 현재 드론과 가까운 박스부터 한 번의 topology 갱신에서 최대 몇 개까지 처리할지 결정한다.
# 값 증가 시 넓은 영역을 빠르게 반영하지만 순간 연산량이 증가하고, 값 감소 시 연산량은 줄지만 먼 구역의 갱신이 늦거나 누락될 수 있다.
# 전체 맵의 박스 수나 크기가 아니라 한 번에 처리할 박스 수만 제한하며, 현재 값 99999999는 사실상 무제한이다.
max_update_region_num: 99999999  # 한 번의 topology 갱신에서 처리할 최대 박스 수[개]

# bubble_topo/*, bubble_astar/* : Topology graph 생성·경로 탐색 끝
# ====================================================================

# ====================================================================
# frontier/*, lidar_perception/* : Frontier 후보와 LiDAR 인식 모델 시작

# [Frontier 후보 샘플링][현재 비활성]
# 현재 viewpoint 후보 생성은 ViewpointManager/sample_pillar_*로 대체되었으며, 아래 값은 실행 로그에만 기록된다.
frontier/candidate_dphi: 0.26
frontier/candidate_znum: 3

lidar_perception/fov_up: 40.0  # 센서 프레임 = body +15° + lidar_pitch 25 (cloud_crop/fov_up 과 한 세트)
lidar_perception/fov_down: 10.0 # 센서 프레임 = body -15° + 25 (cloud_crop/fov_down 과 한 세트)
lidar_perception/lidar_pitch: 25.0

# for viewpoint evaluation. more conservative then actual fov.
lidar_perception/fov_viewpoint_up: 40.0
lidar_perception/fov_viewpoint_down: 10.0
lidar_perception/fov_viewpoint_horizontal: 100
# [LiDAR 장애물 검색 최대거리][m][하드웨어 설정]
# Topology 갱신과 주변 장애물 KNN 검색에 사용하는 최대거리이며, 검색 결과가 없으면 이 거리만큼 빈 공간으로 간주한다.
# LiDAR 유효거리와 점군 밀도에 맞춘 검증값이므로 임의로 수정하지 않는다.
lidar_perception/max_ray_length: 30

# NUC mid360_mlx tuning baseline: disable the horizontal FOV-edge scan.
lidar_perception/yaw_fov: 120.0
lidar_perception/is_360lidar: true

# frontier/*, lidar_perception/* : Frontier 후보와 LiDAR 인식 모델 끝
# ====================================================================

# ====================================================================
# local_planning/* : 관측 영역 Corridor 제한 시작

# [관측 영역 Corridor 안전 설정][수정 금지]
# 미관측 영역으로 Corridor가 확장되지 않도록 하는 검증값이므로 변경하지 않는다.
local_planning/clip_corridor_to_observed: true
local_planning/clip_cone_faces: true

# local_planning/* : 관측 영역 Corridor 제한 끝
# ====================================================================

# ====================================================================
# parallel_astar/* : Topology 연결 탐색 시작

# [Topology 연결 탐색 제한시간]
# 기존 연결을 갱신하거나 새로운 연결점을 graph에 추가할 때 연결 경로를 찾기 위해 허용하는 최대 연산시간이다.
# 값 증가 시 연결 성공 가능성은 커지지만 연산시간이 증가하고, 값 감소 시 빠르게 종료하지만 실제 경로가 있어도 연결에 실패할 수 있다.
# 지나치게 작으면 topology graph가 끊겨 경로 탐색이 실패할 수 있다.
parallel_astar/update_connection_timeout: 0.004  # 기존 graph 연결 갱신 제한시간[s]
parallel_astar/insert_node_timeout: 0.004         # 새 연결점 삽입 시 연결 탐색 제한시간[s]

# parallel_astar/* : Topology 연결 탐색 끝
# ====================================================================

# ====================================================================
# FrontierManager/* : Frontier 검출·클러스터링 시작

# [Frontier 지도의 셀 크기]
# LiDAR로 본 공간을 몇 m 크기의 정육면체 칸으로 나누어 Frontier를 찾을지 결정한다.
# 값 증가 시 셀과 Frontier 묶음이 줄어 viewpoint 생성 대상도 감소할 수 있지만 좁은 통로를 놓칠 수 있고, 값 감소 시 작은 Frontier와 viewpoint 후보가 늘지만 연산량·메모리·노이즈가 증가한다.
FrontierManager/cell_size: 0.2  # 한 셀의 가로·세로·높이[m]

# [새 관측 주변의 재검사 범위]
# 새로운 LiDAR 점이 들어왔을 때 주변 몇 칸까지 다시 확인하여 잘못 남은 Frontier와 노이즈를 정리할지 결정한다.
# 값 증가 시 잘못 남은 Frontier와 viewpoint 목표가 빠르게 정리되지만 연산량이 증가하고, 값 감소 시 연산은 줄지만 이미 해소된 Frontier에서 viewpoint가 계속 생성될 수 있다.
FrontierManager/noise_cell_range: 1  # 주변 재검사 범위[셀]

# [관측 방향 판정 기준]
# 벽 모서리나 점군이 끊긴 부분을 정상적으로 관측한 공간으로 인정할지, viewpoint에서 해당 Frontier가 잘 보이는지 판단하는 엄격도를 결정한다.
# 값 증가 시 관측과 viewpoint 가시성 판정이 엄격해져 유효 viewpoint가 줄거나 0개가 될 수 있고, 값 감소 시 viewpoint는 쉽게 생성되지만 불완전한 관측까지 유효하다고 판단할 수 있다.
FrontierManager/good_observation_direction_score: 0.8  # 관측 방향 신뢰 기준[0~1]

# [근거리 강제 관측 완료 거리]
# 드론과 가까운 셀은 관측 방향이 다소 좋지 않아도 관측 완료(DENSE)로 처리하여 Frontier 대상에서 제거할 거리를 결정한다.
# 값 증가 시 근거리 Frontier 묶음과 viewpoint 목표가 빠르게 줄지만 실제 미관측 영역까지 제거할 수 있고, 값 감소 시 근거리 Frontier와 viewpoint가 오래 남아 반복 목표가 될 수 있다.
FrontierManager/good_observation_force_trust_length: 1.0  # 강제 관측 완료 거리[m]

# [일반 관측 신뢰 거리]
# LiDAR에서 몇 m 떨어진 셀까지 정상 관측으로 인정하고, viewpoint가 해당 Frontier를 볼 수 있다고 평가할지 결정한다.
# 값 증가 시 먼 셀이 관측 완료되어 Frontier는 줄지만 기존 Frontier는 더 먼 viewpoint에서도 평가할 수 있고, 값 감소 시 가까운 viewpoint만 유효해져 후보가 줄고 같은 장소를 반복 탐사할 수 있다.
FrontierManager/good_observation_trust_length: 20.0  # 일반 관측 및 viewpoint 평가 거리[m]

# [한 번에 갱신할 LiDAR 거리]
# 현재 드론 주변 몇 m까지 Frontier 지도를 새 점군으로 갱신할지 결정한다.
# 값 증가 시 먼 Frontier와 viewpoint 목표가 빠르게 생성·갱신되지만 연산량이 증가하고, 값 감소 시 먼 Frontier와 viewpoint 생성이 늦어져 가까운 영역 위주로 탐사한다.
FrontierManager/update_length: 25.0  # Frontier 지도 갱신 반경[m]

# [탐사 박스 경계 Frontier 제거]
# 탐사 허용 범위 끝부분의 해소할 수 없는 Frontier를 몇 칸까지 viewpoint 생성 대상에서 제외할지 결정한다.
# 값 증가 시 박스 경계의 반복 viewpoint와 불필요한 탐사는 줄지만 경계 근처의 유효 viewpoint도 사라질 수 있고, 값 감소 시 경계 viewpoint는 늘지만 해소되지 않는 목표를 반복 방문할 수 있다.
FrontierManager/box_boundary_margin: 2  # 경계 Frontier 억제 폭[셀], 0이면 비활성

# [Frontier 묶음의 최대 크기]
# 서로 붙어 있는 Frontier를 하나의 viewpoint 생성 대상으로 최대 어느 크기까지 묶을지 결정한다.
# 값 증가 시 넓은 Frontier가 하나로 합쳐져 묶음과 대표 viewpoint 수가 줄고, 값 감소 시 Frontier가 여러 묶음으로 나뉘어 생성되는 viewpoint 목표 수가 증가한다.
FrontierManager/cluster_max_size: 3.0  # Frontier 묶음의 최대 크기[m]

# [Viewpoint 생성 대상 Frontier 최소 크기]
# Frontier 묶음이 이 값보다 작으면 dormant로 분류하여 viewpoint 후보 생성 단계로 넘기지 않는다.
# 값 증가 시 dormant Frontier가 늘어 viewpoint를 생성하는 Frontier 묶음과 전체 viewpoint 후보 수가 감소하고, 값 감소 시 작은 Frontier도 후보 생성 단계로 넘어가 viewpoint 수가 증가하지만 노이즈 목표와 연산량도 증가할 수 있다.
# 값이 너무 크면 Frontier가 남아 있어도 viewpoint가 0개가 되어 탐사가 조기에 종료될 수 있다.
FrontierManager/cluster_min_size: 0.5  # Viewpoint 생성 대상으로 인정할 Frontier 묶음의 최소 크기

# [같은 Frontier로 연결할 거리]
# Frontier 셀끼리 몇 m 이내에 있을 때 하나의 viewpoint 생성 대상으로 묶을지 결정한다.
# 값 증가 시 떨어진 셀도 하나로 합쳐져 Frontier 묶음과 viewpoint 목표 수가 줄고, 값 감소 시 작은 묶음과 viewpoint 목표가 늘지만 너무 작게 분리된 묶음은 dormant로 제외될 수 있다.
FrontierManager/cluster_min_radius: 1.0  # 이웃 Frontier 검색 거리[m]

# [같은 Frontier로 인정할 표면 방향]
# 서로 다른 방향을 향하는 벽과 모서리의 Frontier를 하나의 viewpoint 생성 대상으로 묶을지 결정한다.
# 값 증가 시 같은 방향의 셀만 묶여 Frontier 묶음과 viewpoint 목표가 늘 수 있고, 값 감소 시 코너처럼 방향이 다른 셀도 합쳐져 목표 수는 줄지만 하나의 viewpoint로 전체 Frontier를 보기 어려울 수 있다.
FrontierManager/cluster_direction_radius: 0.5  # 표면 방향 유사도[-1~1]

# [클러스터링 시작에 필요한 Frontier 수]
# 새로 발견된 Frontier 셀이 최소 몇 개 이상일 때 묶음을 만들고 viewpoint 생성을 시작할지 결정한다.
# 값 증가 시 적은 Frontier 입력은 클러스터링되지 않아 viewpoint가 생성되지 않고, 값 감소 시 적은 셀에서도 viewpoint가 생성되지만 노이즈 목표가 증가할 수 있다.
FrontierManager/cluster_minmum_point_num: 4  # 신규 Frontier 최소 셀 수[개]

# FrontierManager/* : Frontier 검출·클러스터링 끝
# ====================================================================

# ====================================================================
# ViewpointManager/* : Viewpoint 생성·선택 시작

# [Viewpoint 높이 범위]
# Frontier보다 위·아래 어느 높이에서 드론의 관측 위치를 찾을지 결정한다.
# 아래쪽 후보가 필요하면 min_height를 더 음수로, 위쪽 후보가 필요하면 max_height를 높인다.
# 범위를 너무 넓히면 바닥·천장 근처의 불필요한 후보가 증가할 수 있다.
ViewpointManager/sample_pillar_min_height: -1.0  # Frontier 기준 아래쪽 탐색 한계[m]
ViewpointManager/sample_pillar_max_height: 1.0   # Frontier 기준 위쪽 탐색 한계[m]

# [Viewpoint 높이별 후보 수]
# 위·아래 탐색 범위에 몇 개의 높이 후보를 만들지 결정한다.
# 적절한 높이의 viewpoint를 못 찾으면 증가, 연산이 느리면 감소한다.
ViewpointManager/sample_pillar_height_layer_num: 5  # 높이 후보 층 수[개]

# [Viewpoint 거리 범위]
# Frontier에서 얼마나 가까운 곳부터 먼 곳까지 관측 위치를 찾을지 결정한다.
# 좁은 통로에서 viewpoint가 없으면 min_radius를 낮추고, 가까운 곳에 공간이 없으면 max_radius를 높인다.
# min_radius를 너무 낮추면 벽 가까이에 후보가 생성되고, max_radius를 너무 높이면 불필요하게 먼 목표가 선택될 수 있다.
ViewpointManager/sample_pillar_min_radius: 0.8  # 가장 가까운 후보 거리[m]
ViewpointManager/sample_pillar_max_radius: 2.0  # 가장 먼 후보 거리[m]

# [Viewpoint 거리별 후보 수]
# 가까운 곳부터 먼 곳까지 몇 단계의 거리 후보를 만들지 결정한다.
# 유효한 거리의 viewpoint를 자주 놓치면 증가, 연산이 느리면 감소한다.
ViewpointManager/sample_pillar_radius_layer_num: 8  # 거리 후보 단계 수[개]

# [Viewpoint 방향별 후보 수]
# Frontier 주변 360도에서 몇 방향으로 관측 위치를 만들지 결정한다.
# 통로 방향의 viewpoint를 못 찾으면 증가, 후보가 너무 많아 연산이 느리면 감소한다.
ViewpointManager/sample_pillar_circle_sample_num: 8  # 한 바퀴의 방향 후보 수[개]

# [Viewpoint와 장애물의 최소 거리]
# 벽이나 장애물에 너무 가까운 viewpoint 후보를 제거한다.
# 좁은 통로에서 viewpoint가 모두 사라지면 낮추고, 목표가 벽에 너무 가까우면 높인다.
# 너무 낮추면 벽 근처 목표와 충돌 위험이 증가하고, 너무 높이면 viewpoint가 0개가 될 수 있다.
ViewpointManager/min_obstacle_clearance: 0.5  # 장애물과 확보할 최소 거리[m]

# [한 번에 검사할 Frontier 수]
# 가까운 Frontier 중 이번 계획 주기에 viewpoint를 검사할 최대 개수를 결정한다.
# Frontier가 남았는데 viewpoint 0개로 탐사가 끝나면 높이고, viewpoint 계산이 너무 느리면 낮춘다.
# 후보 위치 모양을 바꾸는 값은 아니며, 이번 주기에 검사하는 Frontier 범위만 바꾼다.
ViewpointManager/local_tsp_size: 10  # 한 주기에 검사할 Frontier 묶음 수[개]


# ViewpointManager/* : Viewpoint 생성·선택 끝
# ====================================================================

# [탐사 허용 영역]
# EPIC은 아래 박스 내부에서만 Frontier, viewpoint 및 경로를 생성한다.
box_num: 1                              # 탐사 허용 박스 수[개]
box_0/down: [-150.0, -150.0, 0.4]      # 박스의 최소 [X, Y, Z] 좌표[m]
box_0/up:   [150, 150, 2.0]             # 박스의 최대 [X, Y, Z] 좌표[m]
dead_area_num: 0                        # 박스 내부의 탐사 금지 영역 수[개], 0이면 없음
# ====================================================================
# local_planning/*, MINCO : 국소 궤적·Corridor·비행 제한 시작

# [국소 궤적 최대 길이][현장 튜닝]
# 현재 위치에서 선택된 viewpoint 방향으로 한 번에 생성할 MINCO 국소 궤적 구간의 최대 길이를 결정한다.
# Frontier와 viewpoint는 정상적으로 생성되지만 궤적이 목표 전에 계속 짧게 끝나면 값을 늘려 viewpoint까지 이어지는 궤적과 탐사 가능성을 높일 수 있다.
# 충돌·Corridor·topology 연결 실패로 궤적 자체가 생성되지 않는 문제는 이 값을 늘려도 해결되지 않으며, 값이 크면 궤적 생성 연산량이 증가할 수 있다.
max_traj_len: 5.0  # 한 번에 생성할 국소 궤적의 최대 길이[m]  (real1.yaml 과 동기화)

# [Corridor 장애물 입력 해상도][현장 튜닝]
# Guide path 주변 장애물 점군을 몇 m 간격의 Voxel로 줄인 뒤 FIRI에 전달할지 결정한다.
# 값 증가 시 연산량은 감소하지만 얇은 벽과 작은 장애물 형상이 누락될 수 있고, 값 감소 시 장애물 표현은 촘촘해지지만 연산량과 메모리 사용량이 증가한다.
local_planning/corridor/obstacle_voxel_size: 0.28  # Corridor 생성용 장애물 Voxel 크기[m]

# [Corridor 장애물 검색 범위][현장 튜닝]
# 잘린 Guide path의 바깥쪽으로 장애물 점을 추가 검색할 X·Y 및 Z 방향 여유 거리를 결정한다.
# 값 증가 시 더 먼 벽까지 반영하지만 검색 점과 연산량이 증가하고, 값 감소 시 가까운 장애물이 검색 범위 밖으로 빠져 Corridor가 벽을 포함할 수 있다.
local_planning/corridor/search_margin_xy: 3.0  # Guide path 좌우·전후 장애물 검색 여유[m]
local_planning/corridor/search_margin_z: 1.0   # Guide path 상하 장애물 검색 여유[m]

# [Corridor 진행 구간 길이][현장 튜닝]
# max_traj_len으로 잘린 전체 Guide path를 FIRI Corridor 조각으로 나눌 때 한 조각이 진행할 최대 길이를 결정한다.
# 값 증가 시 Corridor 조각 수와 연산량은 줄지만 긴 구간의 복잡한 장애물 형상을 하나의 Corridor가 처리해야 하고, 값 감소 시 짧고 많은 Corridor가 생성되어 굴곡을 세밀하게 따르지만 연산량이 증가한다.
# max_traj_len은 이번 국소 계획의 전체 Guide path 길이이고, 이 값은 그 경로를 나누는 조각 길이이므로 전체 목적지 거리를 늘리지 않는다.
local_planning/corridor/progress_length: 7.0  # FIRI Corridor 한 조각의 최대 진행 길이[m]

# [Corridor 장애물 샘플 상한][현장 튜닝]
# VoxelGrid를 통과한 장애물 중 FIRI 한 구간에서 사용할 최대 점 개수를 결정한다.
# 값 증가 시 벽 형상을 더 많이 반영하지만 FIRI 연산량이 증가하고, 값 감소 시 연산은 빨라지지만 샘플에서 빠진 장애물이 Corridor 내부에 들어갈 수 있다.
local_planning/corridor/max_obstacle_samples: 500  # 구간별 최대 장애물 점 수[개]

# [FIRI 장애물 처리 거리][현장 튜닝]
# FIRI 내부 변환 좌표에서 이 값보다 먼 장애물 후보를 분리 평면 계산에서 제외한다.
# 값 증가 시 먼 장애물을 더 많이 반영하지만 연산량이 증가하고, 값 감소 시 가까운 장애물만 처리하여 벽이나 장애물 평면이 누락될 수 있다.
local_planning/corridor/firi_obstacle_distance_limit: 10.0

# [FIRI 평면 처리 상한][현장 튜닝]
# 한 번의 FIRI 계산에서 경계면과 장애물 분리 평면을 최대 몇 개까지 처리할지 결정한다.
# 값 증가 시 복잡한 벽 형상을 더 많이 반영하지만 연산량이 증가하고, 값 감소 시 연산은 빨라지지만 처리 상한 뒤의 장애물이 누락될 수 있다.
# 탐색 경계의 기본 6개 면을 처리해야 하므로 6 미만으로 설정할 수 없다.
local_planning/corridor/firi_max_plane_count: 50  # FIRI 반복당 최대 평면 수[개]

# [Corridor Gap 생성 기준][주의]
# 앞뒤 Corridor 연결점에서 위반된 평면 수가 이 값 이상이면 연결 보완용 Gap Corridor를 추가한다.
# 값 증가 시 Gap 생성이 줄어 Corridor가 끊길 수 있고, 값 감소 시 Gap이 자주 생성되어 불필요하게 넓은 연결 영역이 생길 수 있다.
# 현재 Gap Corridor에는 DilateRadiusSoft 축소가 적용되지 않으므로 이 값으로 장애물 안전거리를 조정하지 않는다.
local_planning/corridor/gap_violation_plane_threshold: 3  # Gap 생성 위반 평면 수[개]

# [Corridor 겹침 판정 여유][주의]
# 두 Corridor가 면 접촉이 아닌 충분한 내부 겹침을 갖는지 판정하는 수치 여유값이다.
# 값 증가 시 겹침 판정이 엄격해져 Shortcut이 줄고 Corridor 조각이 더 남으며, 값 감소 시 얇은 겹침도 연결로 인정해 Shortcut이 늘어난다.
# 물리적인 장애물 안전거리나 m 단위 Corridor 폭을 직접 설정하는 값은 아니다.
local_planning/corridor/overlap_tolerance: 0.01

# [Corridor 연결 단절 시 임시 목표][현장 튜닝]
# Corridor가 원래 목표 전에 끊기면 임의의 내부점 대신 연결된 Corridor 안의 Guide path에서 가장 멀리 전진한 점을 임시 목표로 사용한다.
# fallback_target_margin 증가 시 목표가 Corridor 경계에서 더 멀어져 안정적이지만 전진거리가 짧아지고, 감소 시 더 멀리 전진하지만 경계에 가까워질 수 있다.
# fallback_min_progress 증가 시 의미 있게 전진하는 궤적만 허용하지만 좁은 공간에서 계획 실패가 늘고, 감소 시 짧은 궤적이 반복 생성될 수 있다.
local_planning/corridor/fallback_target_margin: 0.1  # 임시 목표와 Corridor 경계 사이의 최소 여유[m]
local_planning/corridor/fallback_min_progress: 0.5   # 임시 목표로 인정할 Guide path 최소 전진거리[m]

# [Corridor·충돌 안전 설정][수정 금지]
# 아래 값은 장애물 안전거리 및 Corridor 크기에 관여하는 검증값이므로 변경하지 않는다.
DilateRadiusSoft: 0.5   # MINCO 최적화의 장애물 안전거리[m]
DilateRadiusHard: 0.4   # 최종 충돌 검사의 장애물 안전거리[m]
MaxCorridorSize: 4.0    # Corridor 한 구간의 최대 크기[m]
# [MINCO 비행 제한값][PX4 하드 제한 아님]
# 아래 값은 MINCO가 궤적을 생성할 때 사용하는 소프트 제한이며, PX4 setpoint나 실제 기체의 하드 제한을 직접 설정하지 않는다.

# [최대 비행 속도]
# MINCO가 생성하는 3차원 궤적의 최대 속도를 결정한다.
# 탐사가 너무 느리면 높이고, 경로 추종 오차·진동·제동거리 문제가 발생하면 낮춘다.
# 값을 높이면 좁은 공간과 급회전 구간에서 벽에 가까워질 위험이 커진다.
MaxVelMag: 0.75  # 최대 비행 속도[m/s]  (real1.yaml 과 동기화)

# [PVA 가속도 제한]
# 위치 궤적 최적화에서 허용할 최대 가속도이며 PX4의 실제 가속도 하드 제한은 아니다.
MaxAccMag: 2.0  # 최대 계획 가속도[m/s^2]

# [이동 궤적에 따른 기체 자세 변화율]
# 급가속·급감속·경로 굴곡을 따라가기 위해 필요한 기체 기울기 변화율의 최대 크기를 MINCO가 계산할 때 사용한다.
# 급격한 기울기 변화와 진동이 발생하면 낮추고, 가속·방향 전환 궤적 생성이 지나치게 제한되면 높인다.
# 기수가 좌우로 회전하는 Yaw 궤적의 속도 제한이 아니며, Yaw 회전속도는 yaw_max_vel에서 설정한다.
# 현재 값 10000은 사실상 이 제한을 사용하지 않는 설정이다.
maxBdrMag: 10000.0  # 위치 궤적으로 인해 발생하는 body rate 최대 크기[rad/s]

# [기체 최대 기울기]
# 가속·감속·방향 전환 시 기체가 최대로 기울어질 수 있는 각도를 결정한다.
# 움직임이 너무 공격적이면 낮추고, 가속이나 방향 전환 성능이 부족하면 높인다.
# 값을 높이면 속도는 빨라질 수 있지만 자세 불안정과 추종 오차가 증가할 수 있다.
MaxTiltAngle: 0.8  # 최대 기울기[rad], 약 45.8도

# [MINCO 추력 범위]
# 궤적을 따라가기 위해 MINCO가 사용할 수 있는 최소·최대 총추력을 결정한다.
# 상승·급제동 성능이 부족하면 MaxThrust를 확인하고, 하강이 어렵거나 계속 떠오르면 MinThrust를 확인한다.
# 이 값은 MINCO가 궤적을 생성할 때 사용하는 소프트 제한이며, PX4에 전달되는 추력 setpoint를 직접 제한하거나 이 범위로 강제하지 않는다.
# 기체의 호버 추력(VehicleMass × GravAcc)이 MinThrust와 MaxThrust 사이에 있어야 한다.
MinThrust: 15.0  # 최소 총추력[N]
MaxThrust: 22.0  # 최대 총추력[N]
VehicleMass: 1.9
GravAcc: 9.8
HorizDrag: 0.0
VertDrag: 0.0
ParasDrag: 0.0
SpeedEps: 0.0001
WeightT: 700.0
WeightSafeT: 200.0
ChiVec: [1.1e+5, 1.5e+4, 1.1e+4, 1.1e+5, 1.1e+6] # [pos_weight, vel_weight, omg_weight, theta_weight, thrust_weight]
PvaRunningWeights: [1.1e+5, 1.5e+4, 1.1e+4]  # Corridor, 속도, 가속도 위반 비용
PvaInitialWeights: [1.0e+2, 1.0e+2]           # 초기 odometry 속도, 0 가속도 reference 비용
PvaTerminalWeights: [1.1e+5, 1.5e+4, 1.1e+4] # 목표 위치, 정지 속도, 정지 가속도 비용
#원본: 2.0e+5, 1.5e+4, 1.0e+4, 1.0e+5, 1.0e+5
#
SmoothingEps: 0.015
IntegralIntervs: 32

# [NaN 방지 수치 안정화][절대 수정 금지]
# 아래 7개 값은 0 나눗셈, 영벡터 정규화, 짧은 경로 구간 및 작은 LU pivot을 방지하는 검증값이다.
# 값을 변경하지 말 것. 항목이 누락되거나 0·음수·비정상 값이면 Planner가 실행을 거부한다.
numerical/yaw_diff_eps: 1.0e-9       # Yaw 차이 계산의 분모 하한
numerical/trig_gradient_eps: 1.0e-9  # acos·sqrt 경계의 gradient 하한
numerical/vector_norm_eps: 1.0e-6    # 벡터 정규화 분모 하한
numerical/min_segment_time: 5.0e-2   # MINCO/Yaw 궤적 구간의 최소 시간[s]
numerical/flatness_norm_eps: 1.0e-6  # Flatness 변환의 norm·분모 하한
numerical/min_path_segment_length: 5.0e-2  # 서로 붙은 guide point를 하나로 합칠 거리[m]
numerical/linear_solve_pivot_eps: 1.0e-12  # MINCO LU 분해에서 허용할 pivot 절대값 하한

RelCostTol: 1.0e-6

# local_planning/*, MINCO : 국소 궤적·Corridor·비행 제한 끝
# ====================================================================

# ====================================================================
# Yaw 궤적 생성 시작

# [최대 Yaw 회전속도]
# 드론의 기수가 이동 경로와 viewpoint를 바라보도록 생성하는 Yaw 궤적의 최대 회전속도를 결정한다.
# 기수 회전이 너무 느리면 높이고, 좌우 급회전·흔들림·Yaw 추종 오차가 발생하면 낮춘다.
# PX4의 실제 Yaw rate 하드 제한이 아니라 EPIC이 생성하는 Yaw 궤적의 계획값이다.
yaw_max_vel: 1.5  # 1.0 rad/s = 57.3 deg/s  (real1.yaml 과 동기화)

# [Yaw 목표 방향 추종 가중치]
# 생성되는 Yaw 궤적이 이동 경로와 viewpoint를 보고 계산한 목표 Yaw 방향을 얼마나 강하게 따라갈지 결정한다.
# 기수가 이동 방향을 잘 바라보지 않으면 높이고, Yaw 변화가 지나치게 민감하거나 불안정하면 낮춘다.
# Yaw 회전속도 값이 아니며, 실제 회전속도는 yaw_max_vel에서 설정한다.
yaw_rho_vis: 10000.0
yaw_time_fwd: 2.5

# Yaw 궤적 생성 끝
# ====================================================================

# [반응형 국소회피][bool][비행안전]
# MID360으로 ML-X FOV를 모사하는 동안 근거리 장애물 회피 명령을 별도로 생성한다.
# true: 회피 노드가 /livox/lidar와 /mavros/local_position/odom을 기본 입력으로 사용한다.
# false: 시작 직후 회피 노드가 종료되며 EPIC 경로 명령만 사용한다.
# ML-X crop은 EPIC 입력에만 적용되며, 회피 노드는 crop 전 raw 센서 점군을 사용한다.
#       false 상태로 시작한 뒤 다시 켜려면 launch 재시작이 필요하다.
local_avoidance/enable: true

# ====================================================================
# fsm/* : 탐사 상태·재계획·이륙·복귀 시작

# Poongsan 전용 FSM 설정
fsm/goal_tolerance: 0.2
fsm/max_segment_length: 99.0
fsm/local_planning_max_hz: 30.0  # Max local planning frequency (Hz)

# Emergency control-error replan: 추종 중인 궤적에서 드론이 이 거리[m] 이상 벗어나면
# (바람·제어기 포화·FAST-LIO 포즈 점프 등) 현재 위치 기준으로 강제 replan. <= 0 이면 비활성.
# NOTE: HITL(MARSIM+실 PX4)에서 1.5m는 PX4 추종 지연만으로도 자주 걸려 static replan(속도0 재출발)
#       -> 가다 서다를 유발. 3.0으로 완화해 "진짜 큰 이탈"에만 발동하도록 함.
#       완전히 끄려면 -1.0 으로. (원래 값: 1.5)
fsm/emergency_replan_control_error: 3.0

# Takeoff & hover-before-explore: 트리거 인식 -> 설정 고도로 상승/호버 ->
# odom상 고도가 목표 근처에 오면(정밀 안정화 불필요) -> 자동 탐색 시작.
# fsm/takeoff_height <= 0 이면 비활성 (트리거 즉시 탐색 시작 = 기존 동작).
fsm/takeoff_height: 1.2         # 목표 호버 고도 [m] (odom-frame z; 원점=이륙지점)
fsm/takeoff_reach_tol: 0.15      # |z-target| < 이 값이면 도달 -> 수용 밴드 1.30~1.60 m
fsm/takeoff_settle_vel: 0.4      # odom 속도 < 이 값이면 OK (정밀 정지 불요, 급상승만 차단)
fsm/takeoff_settle_time: 0.5     # 도달 상태를 이 시간만 유지하면 탐색 시작 [s]
fsm/takeoff_timeout: 20.0        # 타임아웃: 고도 근처면 탐색, 아니면 호버 유지(ERROR)

# ── 탐사 완료 후 자동 원점복귀 + 착륙 (real flight) ──────────────────
# 탐사 끝나면: 마지막 cmd 좌표에서 잠깐 호버(OFFBOARD 유지) → 이륙지점으로 RTH
#  → 홈과의 xy 거리가 rth_land_xy_tol 안에 들면 PX4 AUTO.LAND(쓰로틀 다운/자동 disarm).
fsm/auto_rth_land: true           # 이 동작 on/off (false면 기존: 완료 후 그 자리 hold)
fsm/finish_hover_duration: 1.0    # 복귀 전 마지막 좌표에서 호버 시간 [s]
fsm/rth_land_xy_tol: 0.2          # ★홈 xy 근접 허용치 — 이 안에 들면 착륙 [m]

# [조기 종료 결론 유예]
# NO_FRONTIER 는 '탐사 완료'와 '맵이 아직 안 참'을 구분하지 못한다. 첫
# NO_FRONTIER 시점부터 이 시간 동안은 그 결론을 믿지 않는다. 그 전에
# frontier 가 한 번이라도 잡히면 즉시 통과한다. 아래 EARLY_FINISH 와는
# 별개의 1차 방어선이며, 여태 어느 프로파일에도 없어 코드 기본값 5.0초로
# 돌고 있었다.
fsm/explore_warmup_timeout: 15.0  # [s] frontier 0개 결론 유예 시간

# ── 조기 종료 구제 (EARLY_FINISH) ────────────────────────────────────
# 이륙 직후에는 LiDAR FOV(120°x30°)가 좁아 관측 영역이 거의 없다. 이때 Frontier
# 묶음이 최소 크기에 못 미치거나 전부 도달 불가로 걸러지면 EPIC은 "다 봤다"고
# 판단해 몇 m 도 못 가고 FINISH -> 복귀해 버린다.
# 이 기능은 그 상황에서 탐사를 한 번 더 시도한다: topology graph에서 현재 위치로부터
# 경로거리가 가장 먼 노드를 목표로 삼아 날아가면서 관측을 늘리고, 그 사이 Frontier가
# 되살아나면 그 즉시 평소대로 탐사를 이어간다. 끝까지 아무것도 없으면 정상 복귀한다.
# 이동 중 진짜 Frontier가 생기면 자동으로 그쪽이 우선되므로 별도 설정은 없다.
# ── 이륙 후 제자리 360도 초기 관측 회전 (YAW_ROTATE_INIT) ──────────────
# 이륙 직후에는 LiDAR 가 거의 아무것도 못 봐서 frontier 가 0개로 잡히고, 그대로
# 탐사를 시작하면 첫 계획부터 갈 곳이 없다. 호버 지점을 유지한 채 한 바퀴 돌아
# 주변을 먼저 관측한 뒤 탐사를 시작한다.
# (EARLY_FINISH 가 같은 문제의 사후 구제라면 이쪽은 사전 예방이다)
#
# 흐름: TAKEOFF_HOVER -> YAW_ROTATE_INIT -> PLAN_TRAJ_EXP
# false 면 예전처럼 TAKEOFF_HOVER 에서 곧바로 탐사로 간다.
#
# 완료 판정은 odom yaw 를 누적해서 실제로 360도를 돌았는지로만 한다. 타임아웃은
# 의도적으로 없다 — 회전이 확인되지 않으면 탐사를 시작하지 않고 제자리 호버로
# 남는 편이 안전하다. 기체가 못 돌면 계속 회전 명령을 낸다.
# 상태 관측: /planning/yaw_rotate_init
fsm/yaw_rotate_init_enable: true
fsm/yaw_rotate_init_rate: 0.5     # [rad/s] 회전 각속도 (0.5 = 약 29 deg/s, 한 바퀴 12.6초)

fsm/early_finish_enable: true

# [조기 종료 판정 거리]
# 탐사 종료 시점의 누적 이동거리가 이 값보다 짧으면 "제대로 못 돌아다녔다"고 보고 재시도한다.
# 값 증가 시 재시도가 더 자주 발동하지만 정상 종료까지 재시도로 오인할 수 있고,
# 값 감소 시 확실한 조기 종료만 구제하지만 놓치는 경우가 늘어난다.
# 이륙 상승 구간은 포함되지 않으며, 탐사가 실제로 시작된 시점부터 누적한다.
fsm/early_finish_dist_thresh: 3.0        # 조기 종료로 볼 누적 이동거리 상한[m]

# [재시도 횟수 상한]
# 재시도 후에도 또 짧게 끝나는 상황이 반복되지 않도록 시도 횟수를 제한한다.
# 상한에 도달하면 이후 종료는 무조건 기존 복귀 동작으로 처리한다.
fsm/early_finish_max_retry: 1            # 최대 재시도 횟수[회]

# [목표 도착 허용치]
# 재시도 목표 지점에 이만큼 가까워지면 도착으로 처리하고 통상 종료 판정으로 돌아간다.
# 값이 너무 작으면 실기체 위치오차 때문에 도착 판정이 나지 않아 그 자리에 머물 수 있다.
fsm/early_finish_reach_tol: 0.5          # 도착으로 인정할 거리[m]

# fsm/* : 탐사 상태·재계획·이륙·복귀 끝
# ====================================================================

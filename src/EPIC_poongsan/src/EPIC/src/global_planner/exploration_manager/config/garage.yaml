# ===========================================================================
# map2 = poongsan_garage.pcd  x  ML-X sensor config (120deg x 30deg crop).
# The filename says "garage" for historical reasons, but box_0 below is fitted
# to poongsan_garage.pcd (x -0.09..38.91, y -9.62..18.31) — NOT to garage.pcd,
# which is a different, much larger site. map1 lives in garage_map1.yaml.
#
# Launch with: roslaunch sim_bringup garage_map2_mlx.launch
# ===========================================================================
planner_debug/enable: true
#topic param:
# [SIM only] Do not switch this to real.yaml topics (/Odometry, /cloud_registered);
# MARSIM publishes the simulation odometry/cloud topics below.
odometry_topic: /quad_0/lidar_slam/odom
cloud_topic: /quad0_pcl_render_node/cloud
# [SIM ML-X emulation] MARSIM keeps publishing the full Mid-360 cloud above.
# cloud_crop_bridge crops only the EPIC planner input, matching the real-flight
# setup where localization keeps the raw cloud and exploration sees ML-X FOV.
cloud_crop/enable: true
cloud_crop/output_topic: /quad0_pcl_render_node/cloud_cropped
# [파라미터 규약] cloud_crop/fov_* 는 body(기체) 프레임 기준. body 값 =
# lidar_perception/fov_up/fov_down(15.0/-15.0) − lidar_perception/lidar_pitch(0.0) = 15.0/-15.0.
cloud_crop/fov_horizontal: 120.0
cloud_crop/fov_up: 15.0
cloud_crop/fov_down: -15.0
cloud_crop/yaw_offset_deg: 0.0
cloud_crop/min_range: 0.0
cloud_crop/max_range: 30.0
# [SIM][불확실] MARSIM odom(/quad_0/lidar_slam/odom)이 수평(body) 자세인지 센서 자세인지
# 확인하지 못했다. 다만 아래 lidar_perception/lidar_pitch가 0.0(라이다가 애초에 기울어
# 있지 않음)이라 두 경우의 구분 자체가 무의미하므로 0.0으로 둔다. 실제 물리 장착각이 있는
# real.yaml/mid360_mlx.yaml 프로파일에서만 이 값이 lidar_pitch와 짝을 이뤄 의미를 가진다.
cloud_crop/odom_mount_pitch_deg: 0.0
# [SIM] MARSIM은 cloud/odom 스탬프 일치를 보장하지 않으므로 approximate 유지.
cloud_crop/sync_policy: approximate
cloud_crop/sync_queue: 20
cloud_crop/sync_max_interval_sec: 0.10
cloud_crop/cloud_queue: 5
cloud_crop/odom_queue: 20
cloud_crop/pub_queue: 2
cloud_crop/watchdog_period_sec: 0.5
cloud_crop/require_frame_match: false
cloud_crop/strict_fov_alignment: true
cloud_crop/output_fields: full
cloud_crop/profile_log: true
# Latched crop FOV marker. Its range cap is sampled as a spherical arc grid.
cloud_crop/visualization_topic: /debug/cloud_crop/fov
cloud_crop/visualization_rate_hz: 1.0
cloud_crop/visualization_range: 30.0
cloud_crop/visualization_azimuth_samples: 24
cloud_crop/visualization_elevation_samples: 8
global_planning/w_vdir: 0.0
global_planning/w_yawdir: 0.0
global_planning/w_firstnode: 0.2
#viz
# [SIM keep] real=true enables heavy visualization and can overload RViz; keep false.
view_graph: true
FrontierManager/view_cluster: true
FrontierManager/view_frt: true
# graph
bubble_topo/min_x: 0.6                # Desktop 120-degree comparison value.
bubble_topo/min_y: 0.6                # Desktop 120-degree comparison value.
bubble_topo/min_z: 0.3                # Desktop 120-degree comparison value.
bubble_topo/init_region_size_x: 1.5
bubble_topo/init_region_size_y: 1.5
bubble_topo/init_region_size_z: 1.0
bubble_topo/cube_discrete_size: 0.25  # Desktop YAML value; algorithm.xml overrides both runtimes to 0.3.
bubble_topo/odom_node_distance: 1.5
# topology 노드 생성·유지와 엣지 연결은 이 안전거리 하나를 공통으로 사용한다.
# 별도 node 반경, 하드코딩 +0.1 m 및 goal 반경 추가 0.01 m로 판정이 달랐던 기존 구조는 연결 실패와 설정 해석 혼선을 줄이기 위해 제거했다.
bubble_astar/safe_distance: 0.6
# 갱신 전후 node 중심이 이 거리 이내이고 기존 node가 safe_distance를 만족하면 같은 연결점으로 유지한다.
# 안전거리 미달 node는 위치 차이와 관계없이 매칭하지 않고 제거한다.
bubble_topo/node_match_tolerance: 0.30
# [신규 Topology 노드 생성 안정화 여유거리]
# 새 경로 연결점은 공통 안전거리보다 이 값만큼 더 멀리 있을 때만 topology graph에 처음 추가한다.
# 값 증가 시 안전거리 경계의 node 생성·삭제 반복은 줄지만 좁은 통로의 신규 연결점이 감소할 수 있고, 값 감소 시 신규 연결점은 늘지만 경계에서 graph가 흔들릴 수 있다.
# 기존 node의 유지·삭제와 edge 안전 판정은 계속 safe_distance를 사용하므로 장애물 안전거리를 완화하는 값이 아니다.
bubble_topo/node_insert_margin: 0.05  # 신규 node 삽입 기준 = safe_distance + 0.05 m
# [신규 Topology 노드 위치 흔들림 방지]
# 신규 생성 기준을 통과한 bubble 중 최대 장애물 여유거리와 이 값 이내인 후보를 동급으로 보고, topology 박스 중심에 가장 가까운 위치를 선택한다.
# 값 증가 시 작은 점군 변화에도 node 위치가 안정적으로 유지되지만 가장 넓은 위치에서 멀어질 수 있고, 값 감소 시 더 넓은 위치를 우선하지만 후보 간 node 위치가 바뀔 수 있다.
# 이 값은 신규 node의 안전거리 기준을 낮추지 않으며, 반드시 safe_distance + node_insert_margin을 통과한 후보에만 적용한다.
bubble_topo/node_clearance_tie_tolerance: 0.10  # 동급으로 볼 장애물 여유거리 차이[m]
# map param
max_update_region_num: 99999999
frontier/candidate_dphi: 0.26
frontier/candidate_znum: 3
lidar_perception/fov_up: 15.0
lidar_perception/fov_down: -15.0
# The crop bridge tests elevation after transforming each cloud point into the
# odometry body frame. These bounds are therefore already body-frame bounds.
# Keep this at zero so PR #1 uses the same effective cone as the crop bridge.
# This is not the physical MARSIM sensor mount pitch; see MARSIM garage.launch.
lidar_perception/lidar_pitch: 0.0
lidar_perception/fov_viewpoint_up: 15.0
lidar_perception/fov_viewpoint_down: -15.0
lidar_perception/fov_viewpoint_horizontal: 120.0
# [LiDAR 장애물 검색 최대거리][m][하드웨어 설정]
# Topology 갱신과 주변 장애물 KNN 검색에 사용하는 최대거리이며, 검색 결과가 없으면 이 거리만큼 빈 공간으로 간주한다.
# LiDAR 유효거리와 점군 밀도에 맞춘 검증값이므로 임의로 수정하지 않는다.
lidar_perception/max_ray_length: 18   # [SIM keep] real=1.5 would limit sensing beyond 1.5 m.
# ===== [feature: cone-clip] Local SFC corridor clipping to observed FOV cone =====
# OFF by default -> behavior identical to before. Enable to stop the local planner
# from growing its flight corridor into space a limited-FOV sensor has not seen.
# 1) Describe the sensor FOV (only matters for a forward/cropped LiDAR):
lidar_perception/is_360lidar: false   # false => run the data-driven yaw FOV-edge scan
lidar_perception/yaw_fov: 120.0       # sensor horizontal FOV [deg] for cropped EPIC input
# 2) Enable the clipping (Method B) + the robot-body seed box P0:
local_planning/clip_corridor_to_observed: true  # master switch
local_planning/clip_cone_faces: true            # Method B: intersect polytopes with FOV cone
local_planning/viz_origin_corridor: true         # publish raw FIRI corridor in orange for comparison
local_planning/p0_len_x: 0.6   # P0 seed box body-x (fwd/back) full length [m]
local_planning/p0_len_y: 0.6   # P0 seed box body-y (left/right) full length [m]
local_planning/p0_up: 0.2      # P0 extent above the flight controller [m]
local_planning/p0_down: 0.2    # P0 extent below the flight controller [m]
parallel_astar/update_connection_timeout: 0.01
parallel_astar/insert_node_timeout: 0.01
FrontierManager/cell_size: 0.2
FrontierManager/noise_cell_range: 1
FrontierManager/good_observation_direction_score: 0.6
FrontierManager/good_observation_force_trust_length: 0.5
FrontierManager/good_observation_trust_length: 12.0
FrontierManager/update_length: 15.0 # Keep slightly larger than trust_length; larger values add little benefit.
FrontierManager/cluster_max_size: 5.0
FrontierManager/cluster_min_size: 0.5
FrontierManager/cluster_min_radius: 1.0 # Desktop 120-degree comparison value.
FrontierManager/cluster_direction_radius: 0.8
FrontierManager/cluster_minmum_point_num: 2
# [탐사 박스 경계 Frontier 제거]
# 박스 경계 margin*cell_size 이내의 셀은 frontier 승격 경로에서 제외한다. 경계
# 너머는 관측 자체가 불가라, 두면 영영 해소되지 않는 frontier 가 남아 탐사가
# 끝나지 않거나 같은 지점을 반복 방문한다. 0 이면 비활성.
FrontierManager/box_boundary_margin: 2  # 경계 Frontier 억제 폭[셀]
# Cylindrical viewpoint sampling.
ViewpointManager/sample_pillar_min_height: -1.0
ViewpointManager/sample_pillar_max_height: 1.0
ViewpointManager/sample_pillar_height_layer_num: 9
ViewpointManager/sample_pillar_min_radius: 0.8
ViewpointManager/sample_pillar_max_radius: 3.0
ViewpointManager/sample_pillar_radius_layer_num: 4
ViewpointManager/sample_pillar_circle_sample_num: 12
ViewpointManager/local_tsp_size: 8
# area
# Keep the original-map vertical planning band. The FSM begins planning after
# it climbs from the floor-relative spawn height.
box_num: 1
box_0/down: [-1.0, -9.0, 0.55]
box_0/up: [38.5, 18.0, 2.5]
dead_area_num: 0
# trajectory param
max_traj_len: 5.0

# Corridor/FIRI generation parameters. Field-tuning effects are documented in real.yaml.
local_planning/corridor/obstacle_voxel_size: 0.28       # Increase: faster/coarser obstacle input; decrease: slower/denser input.
local_planning/corridor/search_margin_xy: 3.0           # XY obstacle-search margin around the guide path [m].
local_planning/corridor/search_margin_z: 1.0            # Z obstacle-search margin around the guide path [m].
local_planning/corridor/progress_length: 7.0            # Max seed-path length per FIRI piece [m], not total trajectory length.
local_planning/corridor/max_obstacle_samples: 500       # Max obstacle points retained per FIRI piece.
local_planning/corridor/firi_obstacle_distance_limit: 10.0  # FIRI transformed-distance processing limit.
local_planning/corridor/firi_max_plane_count: 50        # Max boundary/obstacle planes processed per FIRI iteration.
local_planning/corridor/gap_violation_plane_threshold: 3  # Violated-plane count that triggers a gap polytope.
local_planning/corridor/overlap_tolerance: 0.01         # Minimum numerical interior-overlap tolerance.
local_planning/corridor/fallback_target_margin: 0.1     # Keep fallback targets this far inside the connected corridor [m].
local_planning/corridor/fallback_min_progress: 0.5      # Reject fallback targets with less guide-path progress [m].

DilateRadiusSoft: 0.6
DilateRadiusHard: 0.45
MaxCorridorSize: 4.0
# Slow trajectory phase continuously as the command approaches the measured vehicle lead limit.
trajectory_execution/max_lead_time: 0.3
# PX4에는 velocity setpoint를 보내지 않고 position setpoint만 전달한다.
# 계획 속도를 PX4 위치 P 제어의 위치 오차로 변환하기 위해 실제 MPC_XY_P와 동일하게 설정한다.
trajectory_execution/px4_position_p_gain: 1.0  # PX4 수평 위치 P 게인[1/s]
trajectory_execution/yaw_max_acc: 3.5  # 재계획 시 Yaw rate 방향 반전을 완화하는 최대 각가속도[rad/s^2]
MaxVelMag: 0.75
MaxAccMag: 2.0
maxBdrMag: 10000.0
MaxTiltAngle: 0.8
MinThrust: 15.0
MaxThrust: 22.0
VehicleMass: 1.9
GravAcc: 9.8
HorizDrag: 0.0
VertDrag: 0.0
ParasDrag: 0.0
SpeedEps: 0.0001
WeightT: 700.0
WeightSafeT: 200.0
# [pos_weight, vel_weight, omg_weight, theta_weight, thrust_weight]
ChiVec: [1.1e+5, 1.5e+4, 1.1e+4, 1.1e+5, 1.1e+6]
PvaRunningWeights: [1.1e+5, 1.5e+4, 1.1e+4]
PvaInitialWeights: [1.0e+2, 1.0e+2]
PvaTerminalWeights: [1.1e+5, 1.5e+4, 1.1e+4]
SmoothingEps: 0.015
IntegralIntervs: 32

# [NaN 방지 수치 안정화][절대 수정 금지]
# 아래 7개 값은 0 나눗셈, 영벡터 정규화, 짧은 경로 구간 및 작은 LU pivot을 방지하는 검증값이다.
# 값을 변경하지 말 것. 항목이 누락되거나 0·음수·비정상 값이면 Planner가 실행을 거부한다.
numerical/yaw_diff_eps: 1.0e-9       # Yaw 차이 계산의 분모 하한
numerical/trig_gradient_eps: 1.0e-9  # acos·sqrt 경계의 gradient 하한
numerical/vector_norm_eps: 1.0e-6    # 벡터 정규화 분모 하한
numerical/min_segment_time: 5.0e-2   # MINCO/Yaw 궤적 구간의 최소 시간[s]
numerical/flatness_norm_eps: 1.0e-6  # Flatness 변환의 norm·분모 하한
numerical/min_path_segment_length: 5.0e-2  # 서로 붙은 guide point를 하나로 합칠 거리[m]
numerical/linear_solve_pivot_eps: 1.0e-12  # MINCO LU 분해에서 허용할 pivot 절대값 하한

RelCostTol: 1.1e-6
#param for yaw opt
yaw_max_vel: 1.5
yaw_rho_vis: 10000.0
yaw_time_fwd: 2.5
# FSM param
fsm/goal_tolerance: 0.3
fsm/max_segment_length: 99.0
fsm/local_planning_max_hz: 30.0  # Max local planning frequency (Hz). Lower to simulate slow planning.

# Emergency control-error replan: force a replan from the current pose when the
# vehicle deviates from the tracked trajectory by more than this distance [m].
# Static replan restarts at zero velocity and can cause stop-and-go behavior.
# Set <= 0 to disable. Code default is 1.5.
fsm/emergency_replan_control_error: 3.0

# Takeoff and hover-before-explore:
# trigger (2D Nav Goal) -> climb/hover at this height -> start exploration after
# odom height is reached and settled. Set <= 0 to disable.
# This lets a z=0 spawn climb above occupied floor points before the first plan.
fsm/takeoff_height: 1.25          # target hover height [m] in odom z; must remain below box_0/up z.
fsm/takeoff_reach_tol: 0.15       # height is reached when |z - target| is below this value.
fsm/takeoff_settle_vel: 0.4       # considered settled when odom velocity is below this value.
fsm/takeoff_settle_time: 0.03     # match real2.yaml
fsm/takeoff_timeout: 2000.0       # match real2.yaml

# MARSIM validation stops in FINISH. Automatic RTH and landing remain disabled
# until FINISH command ownership between the FSM and traj_server is resolved.
fsm/auto_rth_land: false
# Keep traj_server as the only /position_cmd publisher after FINISH.
fsm/traj_server_owns_finish_cmd: true

# [조기 종료 결론 유예]
# NO_FRONTIER 는 '탐사 완료'와 '맵이 아직 안 참'을 구분하지 못한다. 첫
# NO_FRONTIER 시점부터 이 시간 동안은 그 결론을 믿지 않는다. 그 전에
# frontier 가 한 번이라도 잡히면 즉시 통과한다. 아래 EARLY_FINISH 와는
# 별개의 1차 방어선이며, 여태 어느 프로파일에도 없어 코드 기본값 5.0초로
# 돌고 있었다.
fsm/explore_warmup_timeout: 5.0    # [s] frontier 0개 결론 유예 시간

# Early-finish rescue. When exploration ends after travelling only a short
# distance, the narrow LiDAR FOV most likely hid the remaining frontiers rather
# than the map being complete. Fly once to the farthest reachable topology node
# to gather more observations; if a real frontier reappears on the way, normal
# exploration takes over immediately. Enabled here so the garage simulation
# exercises the same path as the flight profiles.
# ── 이륙 후 제자리 360도 초기 관측 회전 (YAW_ROTATE_INIT) ──────────────
# 이륙 직후에는 LiDAR 가 거의 아무것도 못 봐서 frontier 가 0개로 잡히고, 그대로
# 탐사를 시작하면 첫 계획부터 갈 곳이 없다. 호버 지점을 유지한 채 한 바퀴 돌아
# 주변을 먼저 관측한 뒤 탐사를 시작한다.
# (EARLY_FINISH 가 같은 문제의 사후 구제라면 이쪽은 사전 예방이다)
#
# 흐름: TAKEOFF_HOVER -> YAW_ROTATE_INIT -> PLAN_TRAJ_EXP
# false 면 예전처럼 TAKEOFF_HOVER 에서 곧바로 탐사로 간다.
#
# 완료 판정은 odom yaw 를 누적해서 실제로 360도를 돌았는지로만 한다. 타임아웃은
# 의도적으로 없다 — 회전이 확인되지 않으면 탐사를 시작하지 않고 제자리 호버로
# 남는 편이 안전하다. 기체가 못 돌면 계속 회전 명령을 낸다.
# 상태 관측: /planning/yaw_rotate_init
fsm/yaw_rotate_init_enable: false
fsm/yaw_rotate_init_rate: 0.5     # [rad/s] 회전 각속도 (0.5 = 약 29 deg/s, 한 바퀴 12.6초)

fsm/early_finish_enable: true
# [조기 종료 판정 — 하이브리드 2단]
# 1단: 탐사 종료 시점의 "최대 직선 이탈거리"(탐사 시작점 기준, 단조증가)가
#      dist_thresh 미만이면 조기 종료 의심. 경로 적분이 아니라 최대 변위인 이유:
#      리플랜 플래핑/근거리 셔플만으로 적분이 임계값을 소진해 구제가 죽는 것을
#      막기 위해서다. 멀리 갔다 원점 복귀한 정상 종료는 최대 변위가 크게 남아
#      구제 대상이 되지 않는다.
# 2단: 도달 가능한 "미방문" 노드(비행경로 반경 visited_radius 밖) 중 원점거리
#      최대 노드를 EFP 로 고르되, 그 원점거리가 (최대 변위 + probe_min_gain) 을
#      넘어야 probe 를 보낸다. 못 넘으면 관측 이득이 없으므로 정상 FINISH.
# 강제 /srv_early_finish 는 2단의 gain 조건을 걸지 않는다.
fsm/early_finish_dist_thresh: 3.0        # [m] max displacement less than this at FINISH -> probe
fsm/early_finish_probe_min_gain: 1.0     # [m] EFP origin-dist must exceed max_disp by this
fsm/early_finish_visited_radius: 1.5     # [m] nodes within this of flown path = visited (<=0 off)
fsm/early_finish_max_retry: 1            # retry attempts before falling back to normal FINISH
# [도달 판정 허용치]
# viewpoint 도달 판정(frontier_manager)과 EARLY_FINISH probe(EFP) 도달 판정(FSM)이
# 공유한다. 새 설계에서 EFP 는 TSP 의 viewpoint 후보 하나이므로 같은 허용치를 쓴다.
# 값이 예전(0.3 m / 20 deg)보다 느슨한 이유: 도달 판정의 기준점을 topo 노드
# (graph_->odom_node_->center_) 에서 raw odom(ld_->lidar_pose_) 으로 옮겨 판정 자체가
# 그만큼 엄격해졌기 때문이다. 값 완화와 기준점 정렬은 세트다. 너무 작으면 실기체
# 위치오차 때문에 도착 판정이 나지 않아 그 자리에 머물 수 있다.
# yaw 조건은 viewpoint 판정에만 적용된다 — EFP 에 걸면 접근 종단 yaw 와 노드 yaw 가
# 달라 구조적으로 만족될 수 없고, EFP 가 은퇴하지 못해 RTH 가 영구 봉쇄된다.
# 주의: viewpoint 판정이 발동하면 그 클러스터 셀이 DENSE 로 확정된다 = 실제로 보지
# 못한 공간을 관측완료로 기록하며 되돌릴 수 없다.
ViewpointManager/vp_reached_pos_tol: 0.6         # 도달로 인정할 거리[m] (viewpoint 도달 + EFP 도달 공용)
ViewpointManager/vp_reached_yaw_tol_deg: 60.0    # 도달로 인정할 yaw 차[deg] (viewpoint 도달 판정에만)
